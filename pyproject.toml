[build-system]
# 1.27 supports the license expression and license-files (PEP 639)
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dotbot"
authors = [
  { name = "Gilad Peleg" },
  { name = "Anish Athalye" },
]
description = "A tool that bootstraps your dotfiles"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Utilities",
]
keywords = ["dotfiles"]
dynamic = ["version"]
dependencies = [
  "PyYAML>=6.0.1,<7",
]

[project.scripts]
dotbot = "dotbot.cli:main"

[project.urls]
homepage = "https://github.com/pgilad/dotbot"
repository = "https://github.com/pgilad/dotbot.git"
issues = "https://github.com/pgilad/dotbot/issues"
changelog = "https://github.com/pgilad/dotbot/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/dotbot/__about__.py"

[tool.hatch.build.targets.sdist]
# the recordings are only for the README on GitHub
exclude = ["/docs/demo"]

[tool.hatch.envs.default]
python = "3.14"
installer = "uv"

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.14", "3.15"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=2.0.0",
  "pytest",
  "types-PyYAML>=6.0.1,<7",
]

[tool.hatch.envs.types.scripts]
check = "mypy {args:src tests}"

[tool.mypy]
strict = true
# check against the minimum supported version, so newer APIs are reported
python_version = "3.14"

[tool.ruff]
# the default of Hatch is 120
line-length = 88
# keep the syntax up to date with the minimum supported version (pyupgrade)
lint.extend-select = ["UP"]
lint.ignore = [
  # Messenger isn't a logging.Logger
  "G004",
  "TRY400",
  # imports that only annotations use can stay at the top of the module
  "TC",
]
