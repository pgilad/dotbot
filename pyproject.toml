[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dotbot"
authors = [
  { name = "Anish Athalye", email = "me@anishathalye.com" },
]
description = "A tool that bootstraps your dotfiles"
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
keywords = ["dotfiles"]
dynamic = ["version"]
dependencies = [
  "PyYAML>=6.0.1,<7",
]

[project.scripts]
dotbot = "dotbot.cli:main"

[project.urls]
homepage = "https://github.com/anishathalye/dotbot"
repository = "https://github.com/anishathalye/dotbot.git"
issues = "https://github.com/anishathalye/dotbot/issues"

[tool.hatch.version]
path = "src/dotbot/__about__.py"

[tool.hatch.build.targets.sdist]
exclude = [
  "lib/",
]

[tool.hatch.envs.default]
python = "3.14"
installer = "uv"

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.14", "3.15"]

[tool.coverage.run]
omit = [
  "*/tests/*",
  "*/dotfiles/*" # the tests create some .py files in a "dotfiles" directory
]

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=2.0.0",
  "pytest",
  "types-PyYAML>=6.0.1,<7",
]

[tool.hatch.envs.types.scripts]
check = "mypy {args:src tests}"

[tool.hatch.envs.coverage]
detached = true
installer = "uv"
dependencies = [
  "coverage[toml]",
]

[tool.hatch.envs.coverage.scripts]
html = "coverage html"

[tool.mypy]
strict = true
# check against the minimum supported version, so newer APIs are reported
python_version = "3.14"

[tool.ruff]
extend-exclude = [
  "lib/*.py"
]
# keep the syntax up to date with the minimum supported version (pyupgrade)
lint.extend-select = ["UP"]
