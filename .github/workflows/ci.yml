name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "0 8 * * 6"
jobs:
  test:
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: 1
    strategy:
      fail-fast: false
      matrix:
        os: ["ubuntu-24.04", "macos-latest", "windows-latest"]
        python:
          - "3.14"
          - "3.15"
    runs-on: ${{ matrix.os }}
    name: "Test: Python ${{ matrix.python }} on ${{ matrix.os }}"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pypa/hatch@install
      - run: hatch test -v --include python=${{ matrix.python }} tests
  typecheck:
    name: Type check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pypa/hatch@install
      - run: hatch run types:check
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pypa/hatch@install
      - run: hatch check fmt
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pypa/hatch@install
      - run: hatch check code
