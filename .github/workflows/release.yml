name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  test:
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: 1
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: macos-latest
            platform: macos
            arch: arm64
          - os: windows-latest
            platform: windows
            arch: x64
          - os: windows-11-arm
            platform: windows
            arch: arm64
    runs-on: ${{ matrix.os }}
    name: "Test: ${{ matrix.platform }}-${{ matrix.arch }}"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pypa/hatch@install
      - run: hatch test

  github-release:
    needs: test
    runs-on: ubuntu-24.04
    name: Create GitHub Release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # the changelog has an entry for each minor version (v2.0 for v2.0.0), so
      # a patch release gets only the generated notes
      - name: Get the release notes from the changelog
        run: |
          case "$GITHUB_REF_NAME" in
            *.0) version="${GITHUB_REF_NAME%.0}" ;;
            *) version="" ;;
          esac
          awk -v entry="- $version" '
            $0 == entry { found = 1; next }
            found && /^- / { exit }
            found { sub(/^    /, ""); print }
          ' CHANGELOG.md > release-notes.md
          cat release-notes.md
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          # added after the body
          generate_release_notes: true
